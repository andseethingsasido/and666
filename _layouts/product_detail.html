---
layout: default
---

<div class="pdp-wrapper">
    <!-- 左栏（PC端）：产品名字 + 面料工艺介绍 -->
    <div class="pdp-col-left">
        <h1 class="pdp-title">{{ page.title }}</h1>
        <div class="pdp-details-box">
            <h3>DETAILS / 面料与工艺</h3>
            <ul>
            {% if page.details %}
                {% for item in page.details %}
                    <li>{{ item }}</li>
                {% endfor %}
            {% else %}
                <li>100% 重磅棉质丹宁面料</li>
                <li>手工多重做旧与洗水工艺</li>
            {% endif %}
            </ul>
        </div>
    </div>

    <!-- 中栏：纯净产品图（无显眼按钮，依靠鼠标位置变指针交互） -->
    <div class="pdp-col-center">
        <div class="pdp-gallery-container">
            <div class="pdp-gallery" id="pdpGallery">
                {% for img in page.gallery %}
                    <div class="pdp-slide">
                        <img src="{{ img | relative_url }}" alt="{{ page.title }}">
                    </div>
                {% endfor %}
            </div>
        </div>
    </div>

    <!-- 右栏（PC端）：购买按钮 + 尺码表 -->
    <div class="pdp-col-right">
        <button class="pdp-buy-btn" id="openModalBtn">{{ page.price }}</button>
        <div class="pdp-size-box">
            {{ content }}
        </div>
    </div>
</div>

<!-- ✟ 微信二维码弹窗 ✟ -->
<div class="modal-overlay" id="pdpModal">
    <div class="modal-content">
        <span class="close-btn" id="closeModalBtn">&times;</span>
        <div class="modal-title">Contact</div>
        <img src="{{ '/images/gozhonghao.jpg' | relative_url }}" alt="微信二维码" class="qrcode-img">
        <div class="modal-desc">扫描二维码向主理人发起款式咨询</div>
    </div>
</div>

<!-- 🔍 居中点击：放大细节浮层 ✟ -->
<div class="lightbox-overlay" id="lightbox">
    <span class="lightbox-close" id="lightboxClose">&times;</span>
    <img src="" alt="Detail View" id="lightboxImg">
</div>

<style>
    /* 全局与字体基础 */
    .pdp-title {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #000;
        line-height: 1.4;
    }

    .pdp-buy-btn {
        width: 100%;
        padding: 16px;
        background-color: #000;
        color: #fff;
        border: none;
        font-size: 12px;
        letter-spacing: 3px;
        font-weight: 500;
        cursor: pointer;
        text-transform: uppercase;
        transition: opacity 0.3s;
    }

    .pdp-buy-btn:hover { opacity: 0.85; }

    .pdp-details-box, .pdp-size-box {
        font-size: 11px;
        line-height: 1.8;
        letter-spacing: 1.2px;
        color: #333;
    }

    .pdp-details-box h3, .pdp-size-box h3 {
        font-size: 11px;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin: 0 0 12px 0;
        padding-bottom: 5px;
        border-bottom: 1px solid #eee;
        color: #000;
    }

    .pdp-details-box ul { padding-left: 15px; margin: 0; }

    .pdp-size-box table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
    }

    .pdp-size-box th, .pdp-size-box td {
        border-bottom: 1px solid #eee;
        padding: 8px 4px;
        text-align: center;
        font-size: 10px;
    }

    .pdp-size-box th { font-weight: 600; color: #000; text-transform: uppercase; }

    /* 🖼️ 无缝平铺相册 */
    .pdp-gallery-container {
        width: 100%;
        position: relative;
    }

    .pdp-gallery {
        display: flex;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        gap: 0;
    }

    .pdp-gallery::-webkit-scrollbar { display: none; }

    .pdp-slide {
        flex: 0 0 100%;
        scroll-snap-align: start;
        aspect-ratio: 3 / 4;
        background-color: #f9f9f9;
        overflow: hidden;
    }

    .pdp-slide img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        user-select: none;
        pointer-events: none; /* 让鼠标事件由父容器接管 */
    }

    /* 🔍 放大大图 Lightbox 样式 */
    .lightbox-overlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background-color: rgba(255, 255, 255, 0.98);
        z-index: 999999;
        display: flex; justify-content: center; align-items: center;
        opacity: 0; pointer-events: none;
        transition: opacity 0.25s ease;
        cursor: zoom-out;
    }

    .lightbox-overlay.active {
        opacity: 1; pointer-events: auto;
    }

    .lightbox-overlay img {
        max-width: 90%;
        max-height: 90vh;
        object-fit: contain;
        box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }

    .lightbox-close {
        position: absolute; top: 20px; right: 25px;
        font-size: 30px; cursor: pointer; color: #000;
    }

    /* -------------------------------------------------- */
    /* 📱 移动端布局 (屏宽 < 992px) */
    /* -------------------------------------------------- */
    @media (max-width: 991px) {
        .pdp-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 20px 80px;
        }

        .pdp-col-left, .pdp-col-center, .pdp-col-right {
            display: contents;
        }

        .pdp-title { order: 1; text-align: center; margin-bottom: 20px; }
        .pdp-gallery-container { order: 2; margin-bottom: 25px; }
        .pdp-buy-btn { order: 3; margin-bottom: 35px; }
        .pdp-details-box { order: 4; width: 100%; margin-bottom: 30px; }
        .pdp-size-box { order: 5; width: 100%; }
    }

    /* -------------------------------------------------- */
    /* 💻 PC 端布局 (屏宽 >= 992px) */
    /* -------------------------------------------------- */
    @media (min-width: 992px) {
        .pdp-wrapper {
            display: grid;
            grid-template-columns: 1fr 1.2fr 1fr;
            gap: 50px;
            max-width: 1300px;
            margin: 40px auto 100px;
            padding: 0 40px;
            align-items: start;
        }

        .pdp-col-left {
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 110px;
        }

        .pdp-title { margin-bottom: 35px; }

        .pdp-col-center { width: 100%; }

        .pdp-col-right {
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 110px;
        }

        .pdp-buy-btn { margin-bottom: 35px; }
    }

    /* 微信弹窗 */
    .modal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background-color: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(4px);
        display: flex; justify-content: center; align-items: center;
        z-index: 999999; opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-content {
        background: #fff; border: 1px solid #000;
        padding: 35px 25px; text-align: center; width: 290px; position: relative;
    }
    .close-btn { position: absolute; top: 12px; right: 18px; font-size: 22px; cursor: pointer; color: #888; }
    .qrcode-img { width: 160px; height: 160px; margin: 15px auto; display: block; filter: grayscale(100%); }
    .modal-desc { font-size: 10px; color: #666; letter-spacing: 1px; }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const gallery = document.getElementById('pdpGallery');
        const slides = gallery ? gallery.querySelectorAll('.pdp-slide') : [];
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');

        // 矢量的左右箭头 SVG Cursor
        const leftArrowCursor = `url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="1.5"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>') 16 16, w-resize`;
        const rightArrowCursor = `url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="1.5"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>') 16 16, e-resize`;

        if (gallery && slides.length > 0) {
            // 1. 鼠标悬停位置改变指针样式
            gallery.addEventListener('mousemove', (e) => {
                const rect = gallery.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const ratio = x / rect.width;

                if (ratio < 0.35) {
                    gallery.style.cursor = leftArrowCursor;
                } else if (ratio > 0.65) {
                    gallery.style.cursor = rightArrowCursor;
                } else {
                    gallery.style.cursor = 'zoom-in';
                }
            });

            // 2. 点击判定：左/中/右
            gallery.addEventListener('click', (e) => {
                const rect = gallery.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const ratio = x / rect.width;

                if (ratio < 0.35) {
                    // 左侧：上一张
                    gallery.scrollBy({ left: -gallery.clientWidth, behavior: 'smooth' });
                } else if (ratio > 0.65) {
                    // 右侧：下一张
                    gallery.scrollBy({ left: gallery.clientWidth, behavior: 'smooth' });
                } else {
                    // 中间：全屏看大图细节
                    const activeIndex = Math.round(gallery.scrollLeft / gallery.clientWidth);
                    const currentImg = slides[activeIndex] ? slides[activeIndex].querySelector('img') : null;
                    if (currentImg && lightbox && lightboxImg) {
                        lightboxImg.src = currentImg.src;
                        lightbox.classList.add('active');
                    }
                }
            });
        }

        // 关闭放大浮层
        if (lightbox) {
            lightbox.addEventListener('click', () => lightbox.classList.remove('active'));
        }

        // 微信弹窗逻辑
        const modal = document.getElementById('pdpModal');
        const openBtn = document.getElementById('openModalBtn');
        const closeBtn = document.getElementById('closeModalBtn');
        if (openBtn && modal) openBtn.addEventListener('click', () => modal.classList.add('active'));
        if (closeBtn && modal) closeBtn.addEventListener('click', () => modal.classList.remove('active'));
        if (modal) modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('active'); });
    });
</script>
