---
layout: default
---

<div class="erd-pdp-container">
    <!-- 左侧：无限平铺多图流 -->
    <div class="erd-pdp-gallery">
        {% for img in page.gallery %}
            <img src="{{ img | relative_url }}" alt="{{ page.title }}">
        {% endfor %}
    </div>

    <!-- 右侧：固定详情信息栏 -->
    <div class="erd-pdp-info">
        <div class="erd-info-sticky">
            <h1 class="erd-title">{{ page.title }}</h1>
            <div class="erd-price">{{ page.price }}</div>
            
            <div class="erd-divider"></div>

            <!-- Markdown 里的尺码表与文字内容 -->
            <div class="erd-description">
                {{ content }}
            </div>

            <!-- 点击拉起弹窗按钮 -->
            <button class="erd-buy-btn" id="openModalBtn">INQUIRE / PURCHASE</button>
        </div>
    </div>
</div>

<!-- ✟ 微信二维码弹窗 ✟ -->
<div class="modal-overlay" id="pdpModal">
    <div class="modal-content">
        <span class="close-btn" id="closeModalBtn">&times;</span>
        <div class="modal-title">Contact</div>
        <img src="{{ '/images/gozhonghao.jpg' | relative_url }}" alt="二维码" class="qrcode-img">
        <div class="modal-desc">扫描二维码向主理人咨询该款式</div>
    </div>
</div>

<style>
    .erd-pdp-container {
        max-width: 1300px;
        margin: 40px auto 100px;
        padding: 0 40px;
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 60px;
    }
    .erd-pdp-gallery { display: flex; flex-direction: column; gap: 20px; }
    .erd-pdp-gallery img { width: 100%; height: auto; background-color: #f9f9f9; }
    .erd-info-sticky { position: sticky; top: 110px; }
    .erd-title { font-size: 14px; letter-spacing: 2px; text-transform: uppercase; }
    .erd-price { font-size: 12px; color: #666; margin: 10px 0 20px; }
    .erd-divider { height: 1px; background: #eee; margin: 20px 0; }
    
    /* 尺码表格样式 */
    .erd-description table { width: 100%; border-collapse: collapse; margin: 20px 0; font-size: 11px; }
    .erd-description th, .erd-description td { border-bottom: 1px solid #eee; padding: 8px 4px; text-align: center; }
    .erd-description th { font-weight: 600; text-transform: uppercase; }

    .erd-buy-btn {
        width: 100%; padding: 15px; background: #000; color: #fff;
        border: none; font-size: 11px; letter-spacing: 2px; cursor: pointer; margin-top: 20px;
    }

    /* 弹窗样式 */
    .modal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(255,255,255,0.95); backdrop-filter: blur(4px);
        display: flex; justify-content: center; align-items: center;
        z-index: 99999; opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-content { background: #fff; border: 1px solid #000; padding: 30px; text-align: center; position: relative; width: 300px; }
    .close-btn { position: absolute; top: 10px; right: 15px; cursor: pointer; font-size: 20px; }
    .qrcode-img { width: 160px; height: 160px; margin: 15px 0; }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const modal = document.getElementById('pdpModal');
        const openBtn = document.getElementById('openModalBtn');
        const closeBtn = document.getElementById('closeModalBtn');

        openBtn.addEventListener('click', () => modal.classList.add('active'));
        closeBtn.addEventListener('click', () => modal.classList.remove('active'));
        modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('active'); });
    });
</script>
