---
layout: default
---

<div class="pdp-wrapper">
    <!-- 左栏：产品名字 + 面料与工艺介绍 -->
    <div class="pdp-col-left">
        <h1 class="pdp-title">{{ page.title }}</h1>
        <div class="pdp-details-box">
            <h3>DETAILS / 面料与工艺</h3>
            <ul>
            {% if page.details %}
                {% for item in page.details %}
                    <li>{{ item }}</li>
                {% endfor %}
            {% else %}
                <li>100% 重磅棉质丹宁面料</li>
                <li>手工多重做旧与洗水工艺</li>
            {% endif %}
            </ul>
        </div>
    </div>

    <!-- 中栏：产品图（0延迟切图 + 点击框内放大） -->
    <div class="pdp-col-center">
        <div class="pdp-gallery-container" id="galleryContainer">
            <div class="pdp-gallery" id="pdpGallery">
                {% for img in page.gallery %}
                    <div class="pdp-slide">
                        <img src="{{ img | relative_url }}" alt="{{ page.title }}">
                    </div>
                {% endfor %}
            </div>
            <!-- 🔍 框内局部放大镜层 -->
            <div class="pdp-zoom-lens" id="zoomLens"></div>
        </div>
    </div>

    <!-- 右栏：价格/购买按钮 + 尺码表 -->
    <div class="pdp-col-right">
        <button class="pdp-buy-btn" id="openModalBtn">{{ page.price }}</button>
        <div class="pdp-size-box">
            {{ content }}
        </div>
    </div>
</div>

<!-- ✟ 微信二维码弹窗 ✟ -->
<div class="modal-overlay" id="pdpModal">
    <div class="modal-content">
        <span class="close-btn" id="closeModalBtn">&times;</span>
        <div class="modal-title">Contact</div>
        <img src="{{ '/images/gozhonghao.jpg' | relative_url }}" alt="微信二维码" class="qrcode-img">
        <div class="modal-desc">扫描二维码向主理人发起款式咨询</div>
    </div>
</div>

<style>
    /* 全局与字体基础 */
    .pdp-title {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 2.5px;
        text-transform: uppercase;
        color: #000;
        line-height: 1.5;
        margin-bottom: 25px;
    }

    .pdp-buy-btn {
        width: 100%;
        padding: 16px;
        background-color: #000;
        color: #fff;
        border: none;
        font-size: 12px;
        letter-spacing: 3px;
        font-weight: 600;
        cursor: pointer;
        text-transform: uppercase;
        transition: opacity 0.2s;
        margin-bottom: 25px;
    }

    .pdp-buy-btn:hover { opacity: 0.8; }

    .pdp-details-box, .pdp-size-box {
        font-size: 11px;
        line-height: 1.8;
        letter-spacing: 1.2px;
        color: #333;
        width: 100%;
    }

    /* ✂️ 去除长划线，保持纯粹留白 */
    .pdp-details-box h3, .pdp-size-box h3 {
        font-size: 11px;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin: 0 0 12px 0;
        padding-bottom: 0;
        border-bottom: none;
        color: #000;
        font-weight: 600;
    }

    .pdp-details-box ul { padding-left: 15px; margin: 0; }
    .pdp-details-box li { margin-bottom: 6px; }

    .pdp-size-box table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 5px;
    }

    .pdp-size-box th, .pdp-size-box td {
        border-bottom: 1px solid #eee;
        padding: 8px 4px;
        text-align: center;
        font-size: 10px;
    }

    .pdp-size-box th { font-weight: 600; color: #000; text-transform: uppercase; }

    /* 🖼️ 产品图与放大镜容器 */
    .pdp-gallery-container {
        width: 100%;
        position: relative;
        overflow: hidden;
    }

    .pdp-gallery {
        display: flex;
        gap: 0;
    }

    .pdp-slide {
        flex: 0 0 100%;
        aspect-ratio: 3 / 4;
        background-color: #f9f9f9;
        overflow: hidden;
    }

    .pdp-slide img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        user-select: none;
        pointer-events: none;
    }

    /* 🔍 框内局部放大镜 */
    .pdp-zoom-lens {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.15s ease-out;
        background-repeat: no-repeat;
        background-size: 250%; /* 2.5倍放大 */
        background-position: 0% 0%;
        z-index: 10;
    }

    .pdp-zoom-lens.active {
        opacity: 1;
    }

    /* -------------------------------------------------- */
    /* 📱 移动端布局 (屏宽 < 992px) - 恢复极流畅滑动 */
    /* -------------------------------------------------- */
    @media (max-width: 991px) {
        .pdp-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 20px 80px;
        }

        .pdp-col-left, .pdp-col-center, .pdp-col-right { display: contents; }

        .pdp-title { order: 1; text-align: center; margin-bottom: 20px; }
        .pdp-gallery-container { order: 2; margin-bottom: 25px; }
        .pdp-buy-btn { order: 3; margin-bottom: 35px; }
        .pdp-details-box { order: 4; width: 100%; margin-bottom: 30px; }
        .pdp-size-box { order: 5; width: 100%; }

        /* 📱 移动端开启触控左右滑动 */
        .pdp-gallery {
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .pdp-gallery::-webkit-scrollbar { display: none; }
        .pdp-slide { scroll-snap-align: start; }
    }

    /* -------------------------------------------------- */
    /* 💻 PC 端布局 (屏宽 >= 992px) - 精准控制跳转与放大 */
    /* -------------------------------------------------- */
    @media (min-width: 992px) {
        .pdp-wrapper {
            display: grid;
            grid-template-columns: 1fr 1.1fr 1fr;
            gap: 60px;
            max-width: 1300px;
            min-height: calc(100vh - 160px);
            margin: 0 auto;
            padding: 40px;
            align-items: center;
        }

        .pdp-col-left, .pdp-col-right {
            display: flex; flex-direction: column; justify-content: center;
        }

        .pdp-col-center { width: 100%; }

        .pdp-gallery {
            overflow-x: hidden;
        }
    }

    /* 微信弹窗 */
    .modal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background-color: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(4px);
        display: flex; justify-content: center; align-items: center;
        z-index: 999999; opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-content {
        background: #fff; border: 1px solid #000;
        padding: 35px 25px; text-align: center; width: 290px; position: relative;
    }
    .close-btn { position: absolute; top: 12px; right: 18px; font-size: 22px; cursor: pointer; color: #888; }
    .qrcode-img { width: 160px; height: 160px; margin: 15px auto; display: block; filter: grayscale(100%); }
    .modal-desc { font-size: 10px; color: #666; letter-spacing: 1px; }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const galleryContainer = document.getElementById('galleryContainer');
        const gallery = document.getElementById('pdpGallery');
        const slides = gallery ? gallery.querySelectorAll('.pdp-slide') : [];
        const zoomLens = document.getElementById('zoomLens');

        // 🎨 增大 1/3 后的微型粗线 SVG 鼠标指针 (等比例缩至 16px)
        const leftArrowCursor = `url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3.5" stroke-linecap="square"><line x1="20" y1="12" x2="4" y2="12"></line><polyline points="11 5 4 12 11 19"></polyline></svg>') 8 8, w-resize`;
        const rightArrowCursor = `url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3.5" stroke-linecap="square"><line x1="4" y1="12" x2="20" y2="12"></line><polyline points="13 5 20 12 13 19"></polyline></svg>') 8 8, e-resize`;
        const plusCursor = `url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3.5" stroke-linecap="square"><line x1="12" y1="4" x2="12" y2="20"></line><line x1="4" y1="12" x2="20" y2="12"></line></svg>') 8 8, zoom-in`;
        const minusCursor = `url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3.5" stroke-linecap="square"><line x1="4" y1="12" x2="20" y2="12"></line></svg>') 8 8, zoom-out`;

        let currentIndex = 0;
        let isZoomActive = false; // 跟踪放大状态（点击后激活）

        if (galleryContainer && gallery && slides.length > 0) {
            // 1. 鼠标移动监听：指针样式 & 放大时坐标更新
            galleryContainer.addEventListener('mousemove', (e) => {
                if (window.innerWidth < 992) return; // 移动端不运行 PC 鼠标逻辑

                const rect = galleryContainer.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const ratioX = x / rect.width;
                const ratioY = y / rect.height;

                if (ratioX < 0.35) {
                    galleryContainer.style.cursor = leftArrowCursor;
                } else if (ratioX > 0.65) {
                    galleryContainer.style.cursor = rightArrowCursor;
                } else {
                    galleryContainer.style.cursor = isZoomActive ? minusCursor : plusCursor;
                }

                // 如果处于放大状态，实时跟随鼠标更新画面背景
                if (isZoomActive && zoomLens) {
                    zoomLens.style.backgroundPosition = `${ratioX * 100}% ${ratioY * 100}%`;
                }
            });

            // 移出容器，自动关闭放大状态
            galleryContainer.addEventListener('mouseleave', () => {
                isZoomActive = false;
                if (zoomLens) zoomLens.classList.remove('active');
            });

            // 2. 点击监听：控制 0 延迟切图与点击放大开关
            galleryContainer.addEventListener('click', (e) => {
                if (window.innerWidth < 992) return;

                const rect = galleryContainer.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const ratioX = x / rect.width;

                if (ratioX < 0.35) {
                    // 点击左区：上一张
                    isZoomActive = false;
                    if (zoomLens) zoomLens.classList.remove('active');
                    currentIndex = (currentIndex - 1 + slides.length) % slides.length;
                    gallery.scrollLeft = currentIndex * gallery.clientWidth;
                } else if (ratioX > 0.65) {
                    // 点击右区：下一张
                    isZoomActive = false;
                    if (zoomLens) zoomLens.classList.remove('active');
                    currentIndex = (currentIndex + 1) % slides.length;
                    gallery.scrollLeft = currentIndex * gallery.clientWidth;
                } else {
                    // ⭐️ 点击中区：开/关 框内放大
                    isZoomActive = !isZoomActive;
                    if (isZoomActive && zoomLens) {
                        const currentImg = slides[currentIndex] ? slides[currentIndex].querySelector('img') : null;
                        if (currentImg) {
                            zoomLens.style.backgroundImage = `url('${currentImg.src}')`;
                            const y = e.clientY - rect.top;
                            zoomLens.style.backgroundPosition = `${ratioX * 100}% ${(y / rect.height) * 100}%`;
                            zoomLens.classList.add('active');
                            galleryContainer.style.cursor = minusCursor;
                        }
                    } else if (zoomLens) {
                        zoomLens.classList.remove('active');
                        galleryContainer.style.cursor = plusCursor;
                    }
                }
            });
        }

        // 微信弹窗逻辑
        const modal = document.getElementById('pdpModal');
        const openBtn = document.getElementById('openModalBtn');
        const closeBtn = document.getElementById('closeModalBtn');
        if (openBtn && modal) openBtn.addEventListener('click', () => modal.classList.add('active'));
        if (closeBtn && modal) closeBtn.addEventListener('click', () => modal.classList.remove('active'));
        if (modal) modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('active'); });
    });
</script>
