---
layout: default
---

<div class="pdp-wrapper">
    <!-- 左栏（PC端吸顶）：名字 + 介绍 -->
    <div class="pdp-col-left">
        <h1 class="pdp-title">{{ page.title }}</h1>
        <div class="pdp-details-box">
            <h3>DETAILS / 面料与工艺</h3>
            <ul>
            {% for item in page.details %}
                <li>{{ item }}</li>
            {% endfor %}
            </ul>
        </div>
    </div>

    <!-- 中栏：图片展示区（PC优化：左右切换箭头 + 鼠标拖拽 + 页码指示） -->
    <div class="pdp-col-center">
        <div class="pdp-gallery-container">
            <button class="pdp-arrow prev" id="prevSlide" aria-label="Previous">‹</button>
            <div class="pdp-gallery" id="pdpGallery">
                {% for img in page.gallery %}
                    <div class="pdp-slide">
                        <img src="{{ img | relative_url }}" alt="{{ page.title }}">
                    </div>
                {% endfor %}
            </div>
            <button class="pdp-arrow next" id="nextSlide" aria-label="Next">›</button>
            
            <div class="pdp-counter" id="pdpCounter">1 / {{ page.gallery.size }}</div>
        </div>
    </div>

    <!-- 右栏（PC端吸顶）：购买按钮 + 尺码表 -->
    <div class="pdp-col-right">
        <button class="pdp-buy-btn" id="openModalBtn">{{ page.price }}</button>
        <div class="pdp-size-box">
            {{ content }}
        </div>
    </div>
</div>

<!-- ✟ 微信二维码弹窗 ✟ -->
<div class="modal-overlay" id="pdpModal">
    <div class="modal-content">
        <span class="close-btn" id="closeModalBtn">&times;</span>
        <div class="modal-title">Contact</div>
        <img src="{{ '/images/gozhonghao.jpg' | relative_url }}" alt="微信二维码" class="qrcode-img">
        <div class="modal-desc">扫描二维码向主理人发起款式咨询</div>
    </div>
</div>

<style>
    /* 全局公共样式 */
    .pdp-title {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #000;
        line-height: 1.4;
    }

    .pdp-buy-btn {
        width: 100%;
        padding: 16px;
        background-color: #000;
        color: #fff;
        border: none;
        font-size: 12px;
        letter-spacing: 3px;
        font-weight: 500;
        cursor: pointer;
        text-transform: uppercase;
        transition: opacity 0.3s;
    }

    .pdp-buy-btn:hover { opacity: 0.85; }

    .pdp-details-box, .pdp-size-box {
        font-size: 11px;
        line-height: 1.8;
        letter-spacing: 1.2px;
        color: #333;
    }

    .pdp-details-box h3, .pdp-size-box h3 {
        font-size: 11px;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin: 0 0 12px 0;
        padding-bottom: 5px;
        border-bottom: 1px solid #eee;
        color: #000;
    }

    .pdp-details-box ul { padding-left: 15px; margin: 0; }

    .pdp-size-box table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
    }

    .pdp-size-box th, .pdp-size-box td {
        border-bottom: 1px solid #eee;
        padding: 8px 4px;
        text-align: center;
        font-size: 10px;
    }

    .pdp-size-box th { font-weight: 600; color: #000; text-transform: uppercase; }

    /* 🖼️ 图片轮播容器 */
    .pdp-gallery-container {
        width: 100%;
        position: relative;
    }

    .pdp-gallery {
        display: flex;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        gap: 10px;
        cursor: grab;
    }

    .pdp-gallery.active-drag { cursor: grabbing; scroll-snap-type: none; }
    .pdp-gallery::-webkit-scrollbar { display: none; }

    .pdp-slide {
        flex: 0 0 100%;
        scroll-snap-align: start;
        aspect-ratio: 3 / 4;
        background-color: #f9f9f9;
        overflow: hidden;
    }

    .pdp-slide img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        user-select: none;
    }

    /* PC端左右导航箭头 */
    .pdp-arrow {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 36px;
        height: 36px;
        background: rgba(255, 255, 255, 0.8);
        border: 1px solid #eee;
        font-size: 20px;
        line-height: 32px;
        text-align: center;
        cursor: pointer;
        z-index: 10;
        transition: all 0.2s;
        display: none; /* 默认隐藏，PC端显示 */
    }

    .pdp-arrow:hover { background: #000; color: #fff; border-color: #000; }
    .pdp-arrow.prev { left: 10px; }
    .pdp-arrow.next { right: 10px; }

    .pdp-counter {
        text-align: center;
        font-size: 9px;
        letter-spacing: 2px;
        color: #888;
        margin-top: 10px;
    }

    /* -------------------------------------------------- */
    /* 📱 移动端布局 (屏宽 < 992px) */
    /* -------------------------------------------------- */
    @media (max-width: 991px) {
        .pdp-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 20px 80px;
        }

        /* 拆解栏目，允许直接对其内部元素排序 */
        .pdp-col-left, .pdp-col-center, .pdp-col-right {
            display: contents;
        }

        .pdp-title { order: 1; text-align: center; margin-bottom: 20px; }
        .pdp-gallery-container { order: 2; margin-bottom: 25px; }
        .pdp-buy-btn { order: 3; margin-bottom: 35px; }
        .pdp-details-box { order: 4; width: 100%; margin-bottom: 30px; }
        .pdp-size-box { order: 5; width: 100%; }
    }

    /* -------------------------------------------------- */
    /* 💻 PC 端布局 (屏宽 >= 992px) */
    /* -------------------------------------------------- */
    @media (min-width: 992px) {
        .pdp-wrapper {
            display: grid;
            grid-template-columns: 1fr 1.2fr 1fr;
            gap: 50px;
            max-width: 1300px;
            margin: 40px auto 100px;
            padding: 0 40px;
            align-items: start;
        }

        .pdp-col-left {
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 110px;
        }

        .pdp-title { margin-bottom: 35px; }

        .pdp-col-center { width: 100%; }

        .pdp-col-right {
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 110px;
        }

        .pdp-buy-btn { margin-bottom: 35px; }

        /* PC端显示左右切换箭头 */
        .pdp-arrow { display: block; }
    }

    /* 微信弹窗 */
    .modal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background-color: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(4px);
        display: flex; justify-content: center; align-items: center;
        z-index: 999999; opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-content {
        background: #fff; border: 1px solid #000;
        padding: 35px 25px; text-align: center; width: 290px; position: relative;
    }
    .close-btn { position: absolute; top: 12px; right: 18px; font-size: 22px; cursor: pointer; color: #888; }
    .qrcode-img { width: 160px; height: 160px; margin: 15px auto; display: block; filter: grayscale(100%); }
    .modal-desc { font-size: 10px; color: #666; letter-spacing: 1px; }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const gallery = document.getElementById('pdpGallery');
        const prevBtn = document.getElementById('prevSlide');
        const nextBtn = document.getElementById('nextSlide');
        const counter = document.getElementById('pdpCounter');
        const slides = gallery ? gallery.querySelectorAll('.pdp-slide') : [];

        if (gallery && slides.length > 0) {
            // 1. 箭头点击左右滑动
            if (prevBtn) prevBtn.addEventListener('click', () => gallery.scrollBy({ left: -gallery.clientWidth, behavior: 'smooth' }));
            if (nextBtn) nextBtn.addEventListener('click', () => gallery.scrollBy({ left: gallery.clientWidth, behavior: 'smooth' }));

            // 2. 页码更新 (例如 1 / 5)
            gallery.addEventListener('scroll', () => {
                const index = Math.round(gallery.scrollLeft / gallery.clientWidth) + 1;
                if (counter) counter.innerText = `${Math.min(index, slides.length)} / ${slides.length}`;
            });

            // 3. PC端鼠标按住拖拽滑动 (Drag to scroll)
            let isDown = false, startX, scrollLeft;
            gallery.addEventListener('mousedown', (e) => {
                isDown = true;
                gallery.classList.add('active-drag');
                startX = e.pageX - gallery.offsetLeft;
                scrollLeft = gallery.scrollLeft;
            });
            gallery.addEventListener('mouseleave', () => { isDown = false; gallery.classList.remove('active-drag'); });
            gallery.addEventListener('mouseup', () => { isDown = false; gallery.classList.remove('active-drag'); });
            gallery.addEventListener('mousemove', (e) => {
                if (!isDown) return;
                e.preventDefault();
                const x = e.pageX - gallery.offsetLeft;
                gallery.scrollLeft = scrollLeft - (x - startX) * 1.8;
            });
        }

        // 弹窗逻辑
        const modal = document.getElementById('pdpModal');
        const openBtn = document.getElementById('openModalBtn');
        const closeBtn = document.getElementById('closeModalBtn');
        if (openBtn && modal) openBtn.addEventListener('click', () => modal.classList.add('active'));
        if (closeBtn && modal) closeBtn.addEventListener('click', () => modal.classList.remove('active'));
        if (modal) modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('active'); });
    });
</script>
