---
layout: default
---

<div class="pdp-wrapper">
    <!-- 左栏：产品名字 + 面料与工艺介绍 -->
    <div class="pdp-col-left">
        <h1 class="pdp-title">{{ page.title }}</h1>
        <div class="pdp-details-box">
            <h3>DETAILS / 面料与工艺</h3>
            <ul>
            {% if page.details %}
                {% for item in page.details %}
                    <li>{{ item }}</li>
                {% endfor %}
            {% else %}
                <li>100% 重磅棉质丹宁面料</li>
                <li>手工多重做旧与洗水工艺</li>
            {% endif %}
            </ul>
        </div>
    </div>

    <!-- 中栏：纯净产品图（瞬间跳转 + 极简粗线指针） -->
    <div class="pdp-col-center">
        <div class="pdp-gallery-container">
            <div class="pdp-gallery" id="pdpGallery">
                {% for img in page.gallery %}
                    <div class="pdp-slide">
                        <img src="{{ img | relative_url }}" alt="{{ page.title }}">
                    </div>
                {% endfor %}
            </div>
        </div>
    </div>

    <!-- 右栏：价格/购买按钮 + 尺码表 -->
    <div class="pdp-col-right">
        <button class="pdp-buy-btn" id="openModalBtn">{{ page.price }}</button>
        <div class="pdp-size-box">
            {{ content }}
        </div>
    </div>
</div>

<!-- ✟ 微信二维码弹窗 ✟ -->
<div class="modal-overlay" id="pdpModal">
    <div class="modal-content">
        <span class="close-btn" id="closeModalBtn">&times;</span>
        <div class="modal-title">Contact</div>
        <img src="{{ '/images/gozhonghao.jpg' | relative_url }}" alt="微信二维码" class="qrcode-img">
        <div class="modal-desc">扫描二维码向主理人发起款式咨询</div>
    </div>
</div>

<!-- 🔍 居中点击：放大细节浮层 ✟ -->
<div class="lightbox-overlay" id="lightbox">
    <span class="lightbox-close" id="lightboxClose">&times;</span>
    <img src="" alt="Detail View" id="lightboxImg">
</div>

<style>
    /* 全局与字体基础 */
    .pdp-title {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 2.5px;
        text-transform: uppercase;
        color: #000;
        line-height: 1.5;
        margin-bottom: 25px;
    }

    .pdp-buy-btn {
        width: 100%;
        padding: 16px;
        background-color: #000;
        color: #fff;
        border: none;
        font-size: 12px;
        letter-spacing: 3px;
        font-weight: 600;
        cursor: pointer;
        text-transform: uppercase;
        transition: opacity 0.2s;
        margin-bottom: 25px;
    }

    .pdp-buy-btn:hover { opacity: 0.8; }

    .pdp-details-box, .pdp-size-box {
        font-size: 11px;
        line-height: 1.8;
        letter-spacing: 1.2px;
        color: #333;
        width: 100%;
    }

    .pdp-details-box h3, .pdp-size-box h3 {
        font-size: 11px;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin: 0 0 12px 0;
        padding-bottom: 6px;
        border-bottom: 1px solid #000;
        color: #000;
        font-weight: 600;
    }

    .pdp-details-box ul {
        padding-left: 15px;
        margin: 0;
    }

    .pdp-details-box li {
        margin-bottom: 6px;
    }

    .pdp-size-box table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 5px;
    }

    .pdp-size-box th, .pdp-size-box td {
        border-bottom: 1px solid #eee;
        padding: 8px 4px;
        text-align: center;
        font-size: 10px;
    }

    .pdp-size-box th { font-weight: 600; color: #000; text-transform: uppercase; }

    /* 🖼️ 产品图容器（禁用 smooth 实现瞬间跳转） */
    .pdp-gallery-container {
        width: 100%;
        position: relative;
    }

    .pdp-gallery {
        display: flex;
        overflow-x: hidden; /* 禁用原生的触控滑动，完全由点击精准控制直接跳转 */
        gap: 0;
    }

    .pdp-slide {
        flex: 0 0 100%;
        aspect-ratio: 3 / 4;
        background-color: #f9f9f9;
        overflow: hidden;
    }

    .pdp-slide img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        user-select: none;
        pointer-events: none;
    }

    /* 🔍 放大大图 Lightbox 样式 */
    .lightbox-overlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background-color: rgba(255, 255, 255, 0.98);
        z-index: 999999;
        display: flex; justify-content: center; align-items: center;
        opacity: 0; pointer-events: none;
        transition: opacity 0.2s ease;
        cursor: zoom-out;
    }

    .lightbox-overlay.active {
        opacity: 1; pointer-events: auto;
    }

    .lightbox-overlay img {
        max-width: 90%;
        max-height: 90vh;
        object-fit: contain;
    }

    .lightbox-close {
        position: absolute; top: 20px; right: 25px;
        font-size: 32px; cursor: pointer; color: #000; font-weight: 300;
    }

    /* -------------------------------------------------- */
    /* 📱 移动端布局 (屏宽 < 992px) */
    /* -------------------------------------------------- */
    @media (max-width: 991px) {
        .pdp-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 20px 80px;
        }

        .pdp-col-left, .pdp-col-center, .pdp-col-right {
            display: contents;
        }

        .pdp-title { order: 1; text-align: center; margin-bottom: 20px; }
        .pdp-gallery-container { order: 2; margin-bottom: 25px; }
        .pdp-buy-btn { order: 3; margin-bottom: 35px; }
        .pdp-details-box { order: 4; width: 100%; margin-bottom: 30px; }
        .pdp-size-box { order: 5; width: 100%; }
    }

    /* -------------------------------------------------- */
    /* 💻 PC 端布局 (屏宽 >= 992px) - 统一上下居中对齐 */
    /* -------------------------------------------------- */
    @media (min-width: 992px) {
        .pdp-wrapper {
            display: grid;
            grid-template-columns: 1fr 1.1fr 1fr;
            gap: 60px;
            max-width: 1300px;
            min-height: calc(100vh - 160px); /* 占据屏幕高度，实现视觉上的绝对垂直居中 */
            margin: 0 auto;
            padding: 40px;
            align-items: center; /* ⭐️ 三栏内容统一在同一条水平线上上下居中 */
        }

        .pdp-col-left {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .pdp-col-center {
            width: 100%;
        }

        .pdp-col-right {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
    }

    /* 微信弹窗 */
    .modal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background-color: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(4px);
        display: flex; justify-content: center; align-items: center;
        z-index: 999999; opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-content {
        background: #fff; border: 1px solid #000;
        padding: 35px 25px; text-align: center; width: 290px; position: relative;
    }
    .close-btn { position: absolute; top: 12px; right: 18px; font-size: 22px; cursor: pointer; color: #888; }
    .qrcode-img { width: 160px; height: 160px; margin: 15px auto; display: block; filter: grayscale(100%); }
    .modal-desc { font-size: 10px; color: #666; letter-spacing: 1px; }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const gallery = document.getElementById('pdpGallery');
        const slides = gallery ? gallery.querySelectorAll('.pdp-slide') : [];
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');

        // 🎨 极简加粗 SVG 鼠标指针 (Stroke Width: 3)
        const leftArrowCursor = `url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3" stroke-linecap="square"><line x1="20" y1="12" x2="4" y2="12"></line><polyline points="11 5 4 12 11 19"></polyline></svg>') 18 18, w-resize`;
        const rightArrowCursor = `url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3" stroke-linecap="square"><line x1="4" y1="12" x2="20" y2="12"></line><polyline points="13 5 20 12 13 19"></polyline></svg>') 18 18, e-resize`;
        const plusCursor = `url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3" stroke-linecap="square"><line x1="12" y1="4" x2="12" y2="20"></line><line x1="4" y1="12" x2="20" y2="12"></line></svg>') 18 18, zoom-in`;

        let currentIndex = 0;

        if (gallery && slides.length > 0) {
            // 1. 鼠标位置监测，动态改变指针
            gallery.addEventListener('mousemove', (e) => {
                const rect = gallery.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const ratio = x / rect.width;

                if (ratio < 0.35) {
                    gallery.style.cursor = leftArrowCursor;
                } else if (ratio > 0.65) {
                    gallery.style.cursor = rightArrowCursor;
                } else {
                    gallery.style.cursor = plusCursor;
                }
            });

            // 2. 点击事件：0 延迟直接跳转图片
            gallery.addEventListener('click', (e) => {
                const rect = gallery.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const ratio = x / rect.width;

                if (ratio < 0.35) {
                    // 左侧：上一张 (直接跳转)
                    currentIndex = (currentIndex - 1 + slides.length) % slides.length;
                    gallery.scrollLeft = currentIndex * gallery.clientWidth;
                } else if (ratio > 0.65) {
                    // 右侧：下一张 (直接跳转)
                    currentIndex = (currentIndex + 1) % slides.length;
                    gallery.scrollLeft = currentIndex * gallery.clientWidth;
                } else {
                    // 中间：放大查看大图细节
                    const currentImg = slides[currentIndex] ? slides[currentIndex].querySelector('img') : null;
                    if (currentImg && lightbox && lightboxImg) {
                        lightboxImg.src = currentImg.src;
                        lightbox.classList.add('active');
                    }
                }
            });
        }

        // 关闭放大浮层
        if (lightbox) {
            lightbox.addEventListener('click', () => lightbox.classList.remove('active'));
        }

        // 微信弹窗逻辑
        const modal = document.getElementById('pdpModal');
        const openBtn = document.getElementById('openModalBtn');
        const closeBtn = document.getElementById('closeModalBtn');
        if (openBtn && modal) openBtn.addEventListener('click', () => modal.classList.add('active'));
        if (closeBtn && modal) closeBtn.addEventListener('click', () => modal.classList.remove('active'));
        if (modal) modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('active'); });
    });
</script>
