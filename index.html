---

<!-- 引入主仓库一致的哥特质感字体 -->
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&display=swap" rel="stylesheet">

<style>
    /* ==========================================================
       1. 顶部 header 与底部 footer 反差色样式 (纯黑底白字)
       ========================================================== */
    #header, header, .site-header {
        background-color: #000000 !important;
        color: #ffffff !important;
        border-bottom: 1px solid #1a1a1a;
    }

    #header a, header a, .site-header a,
    #header .menu-item, header .menu-item {
        color: #ffffff !important;
    }

    /* 使 Logo 自动反转为白色 */
    #header .logo-btn, header img.logo, .logo img {
        filter: invert(1) !important;
    }

    /* 汉堡菜单图标调成白色 */
    #header .menu-trigger-icon span, .menu-trigger span {
        background-color: #ffffff !important;
    }

    /* 底部导航栏反差色 */
    footer, #footer, .site-footer {
        background-color: #000000 !important;
        color: #ffffff !important;
        border-top: 1px solid #1a1a1a;
        padding: 40px;
        text-align: center;
        font-size: 10px;
        letter-spacing: 2px;
        text-transform: uppercase;
    }

    footer a, #footer a, .site-footer a {
        color: #aaaaaa !important;
        text-decoration: none;
        transition: color 0.3s;
    }

    footer a:hover, #footer a:hover, .site-footer a:hover {
        color: #ffffff !important;
    }

    /* ==========================================================
       2. ERD 极简商品货架展示区
       ========================================================== */
    .container {
        max-width: 1350px;
        margin: 60px auto;
        padding: 0 40px;
    }

    .product-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 60px 40px;
    }

    .product-item-link {
        text-decoration: none;
        color: inherit;
        display: block;
        opacity: 0;
        transform: translateY(15px);
        animation: erdUnveil 0.8s forwards cubic-bezier(0.25, 1, 0.5, 1);
    }

    @keyframes erdUnveil {
        to { opacity: 1; transform: translateY(0); }
    }

    .product-image-box {
        width: 100%;
        aspect-ratio: 3 / 4;
        background-color: #f9f9f9;
        overflow: hidden;
        margin-bottom: 12px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .product-image-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: grayscale(10%);
        transition: transform 0.6s ease, filter 0.6s ease;
    }

    .product-item-link:hover img {
        transform: scale(1.01);
        filter: grayscale(0%);
    }

    .product-info-meta {
        text-align: left;
        padding-left: 2px;
    }

    .product-name {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 2px;
        font-weight: 400;
        margin: 0 0 4px 0;
        color: #000000;
        line-height: 1.4;
    }

    .product-price {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        font-weight: 300;
        color: #777777;
        margin: 0;
    }

    /* ==========================================================
       3. 哥特暗黑风二维码/联系弹窗
       ========================================================== */
    .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.88);
        backdrop-filter: blur(5px); 
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 100003;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
        opacity: 1;
        pointer-events: auto;
    }

    .modal-content {
        background-color: #000000; 
        border: 1px solid #222222;
        color: #ffffff;
        padding: 35px 30px; 
        text-align: center;
        max-width: 300px;
        width: 90%;
        position: relative;
        transform: scale(0.96);
        transition: transform 0.3s ease;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    .modal-overlay.active .modal-content {
        transform: scale(1);
    }

    /* ✟ 统一为主仓库哥特字体 ✟ */
    .modal-title {
        font-family: 'UnifrakturMaguntia', cursive;
        font-size: 26px;
        font-weight: normal;
        letter-spacing: 1px;
        margin-bottom: 20px;
        color: #ffffff;
    }

    .qrcode-img {
        width: 150px; 
        height: 150px;
        object-fit: contain;
        margin: 0 auto 20px auto;
        display: block;
        filter: grayscale(100%);
        transition: filter 0.3s;
    }

    .qrcode-img:hover { filter: grayscale(0%); }

    .modal-desc {
        font-size: 10px;
        color: #888888;
        letter-spacing: 1.5px;
        line-height: 1.6;
    }

    .close-btn {
        position: absolute;
        top: 12px;
        right: 16px;
        font-size: 20px;
        color: #666666;
        cursor: pointer;
        transition: color 0.3s;
        line-height: 1;
    }

    .close-btn:hover { color: #ffffff; }

    @media (max-width: 768px) {
        .container { margin: 40px auto; padding: 0 15px; }
        .product-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 30px 15px !important; }
        .product-name { font-size: 10px; }
        .product-price { font-size: 10px; }
    }
</style>

<!-- ✟ ERD 极简商品陈列场 ✟ -->
<div class="container">
    <div class="product-grid" id="gridBox"></div>
</div>

<!-- 公众号 / 联系弹窗 -->
<div class="modal-overlay" id="qrcodeModal">
    <div class="modal-content">
        <span class="close-btn" id="closeTrigger">&times;</span>
        <div class="modal-title">Contact</div>
        <img src="{{ '/images/gozhonghao.jpg' | relative_url }}" alt="微信二维码" class="qrcode-img">
        <div class="modal-desc">扫描上方二维码<br>向主理人发起主线咨询或定制采购</div>
    </div>
</div>

<script>
    // 动态读取 products.json 渲染商品
    fetch("{{ '/products.json' | relative_url }}")
        .then(response => response.json())
        .then(products => {
            const gridBox = document.getElementById('gridBox');
            
            products.forEach((product, index) => {
                const itemLink = document.createElement('a');
                itemLink.href = product.link;
                itemLink.className = 'product-item-link';
                itemLink.target = '_blank';
                itemLink.style.animationDelay = `${index * 0.08}s`; 
                
                itemLink.innerHTML = `
                    <div class="product-image-box">
                        <img src="${product.image}" alt="${product.name}">
                    </div>
                    <div class="product-info-meta">
                        <h3 class="product-name">${product.name}</h3>
                        <p class="product-price">${product.price}</p>
                    </div>
                `;
                
                gridBox.appendChild(itemLink);
            });
        })
        .catch(error => console.error('读取商品数据失败:', error));

    // 弹窗交互控制
    const modal = document.getElementById('qrcodeModal');
    const closeBtn = document.getElementById('closeTrigger');
    if (closeBtn) {
        closeBtn.addEventListener('click', () => modal.classList.remove('active'));
    }
    if (modal) {
        modal.addEventListener('click', (e) => { 
            if (e.target === modal) modal.classList.remove('active'); 
        });
    }
</script>
