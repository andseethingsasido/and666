---
layout: default
title: SHOP | andseethingsasido
---

<!-- ✟ ERD 极简商品陈列场 ✟ -->
<div class="container">
    <div class="product-grid" id="gridBox"></div>
</div>

<!-- 公众号 / 联系弹窗 -->
<div class="modal-overlay" id="qrcodeModal">
    <div class="modal-content">
        <span class="close-btn" id="closeTrigger">&times;</span>
        <div class="modal-title">CONTACT</div>
        <img src="{{ '/images/gozhonghao.jpg' | relative_url }}" alt="微信二维码" class="qrcode-img">
        <div class="modal-desc">扫描上方二维码<br>向主理人发起主线咨询或定制采购</div>
    </div>
</div>

<style>
    /* --------------------------------------------------
       1. 仅保留页面专属货架与弹窗样式
       字体自动继承主仓库布局 (inherit)，保持绝对统一
    -------------------------------------------------- */
    .container {
        max-width: 1350px;
        margin: 60px auto;
        padding: 0 40px;
    }

    .product-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 60px 40px;
    }

    .product-item-link {
        text-decoration: none;
        color: inherit;
        display: block;
        opacity: 0;
        transform: translateY(15px);
        animation: erdUnveil 0.8s forwards cubic-bezier(0.25, 1, 0.5, 1);
    }

    @keyframes erdUnveil {
        to { opacity: 1; transform: translateY(0); }
    }

    .product-image-box {
        width: 100%;
        aspect-ratio: 3 / 4;
        background-color: #ffffff;
        overflow: hidden;
        margin-bottom: 12px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .product-image-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: grayscale(10%);
        transition: transform 0.6s ease, filter 0.6s ease;
    }

    .product-item-link:hover img {
        transform: scale(1.01);
        filter: grayscale(0%);
    }

    .product-info-meta {
        text-align: left;
        padding-left: 2px;
    }

    .product-name {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 2px;
        font-weight: 400; /* 采用极致简约的标准字重 */
        margin: 0 0 4px 0;
        color: #000000;
        line-height: 1.4;
    }

    .product-price {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        font-weight: 300;
        color: #777777;
        margin: 0;
    }

    /* --------------------------------------------------
       2. 二维码弹窗质感微调（匹配主仓库极简排版）
    -------------------------------------------------- */
    .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(255, 255, 255, 0.94);
        backdrop-filter: blur(4px); 
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 100003;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
        opacity: 1;
        pointer-events: auto;
    }

    .modal-content {
        background-color: #ffffff; 
        border: 1px solid #000000;
        padding: 35px; 
        text-align: center;
        max-width: 300px;
        width: 90%;
        position: relative;
        transform: scale(0.96);
        transition: transform 0.3s ease;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    .modal-overlay.active .modal-content {
        transform: scale(1);
    }

    .modal-title {
        font-size: 14px;
        font-weight: 400;
        letter-spacing: 4px;
        text-transform: uppercase;
        margin-bottom: 25px;
        color: #000000;
    }

    .qrcode-img {
        width: 150px; 
        height: 150px;
        object-fit: contain;
        margin: 0 auto 20px auto;
        display: block;
        filter: grayscale(100%);
        transition: filter 0.3s;
    }

    .qrcode-img:hover { filter: grayscale(0%); }

    .modal-desc {
        font-size: 10px;
        color: #666666;
        letter-spacing: 1.5px;
        line-height: 1.6;
        text-transform: uppercase;
    }

    .close-btn {
        position: absolute;
        top: 12px;
        right: 16px;
        font-size: 20px;
        color: #999999;
        cursor: pointer;
        transition: color 0.3s;
        line-height: 1;
    }

    .close-btn:hover { color: #000000; }

    @media (max-width: 768px) {
        .container { margin: 40px auto; padding: 0 15px; }
        .product-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 30px 15px !important; }
        .product-name { font-size: 10px; }
        .product-price { font-size: 10px; }
    }
</style>

<script>
    // 动态拉取 JSON 数据并渲染商品
    fetch("{{ '/products.json' | relative_url }}")
        .then(response => response.json())
        .then(products => {
            const gridBox = document.getElementById('gridBox');
            
            products.forEach((product, index) => {
                const itemLink = document.createElement('a');
                itemLink.href = product.link;
                itemLink.className = 'product-item-link';
                itemLink.target = '_blank';
                itemLink.style.animationDelay = `${index * 0.08}s`; 
                
                itemLink.innerHTML = `
                    <div class="product-image-box">
                        <img src="${product.image}" alt="${product.name}">
                    </div>
                    <div class="product-info-meta">
                        <h3 class="product-name">${product.name}</h3>
                        <p class="product-price">${product.price}</p>
                    </div>
                `;
                
                gridBox.appendChild(itemLink);
            });
        })
        .catch(error => console.error('读取商品数据失败:', error));

    // 弹窗关闭逻辑
    const modal = document.getElementById('qrcodeModal');
    const closeBtn = document.getElementById('closeTrigger');
    if (closeBtn) {
        closeBtn.addEventListener('click', () => modal.classList.remove('active'));
    }
    if (modal) {
        modal.addEventListener('click', (e) => { 
            if (e.target === modal) modal.classList.remove('active'); 
        });
    }
</script>
